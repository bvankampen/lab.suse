apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application-collection
spec:
  refreshInterval: "300s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: application-collection
  data:
    - secretKey: user
      remoteRef:
        key: secretstore.lab.suse
        property: dpapps-serviceaccount-user
    - secretKey: token
      remoteRef:
        key: secretstore.lab.suse
        property: dpapps-serviceaccount-token
