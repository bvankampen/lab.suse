defaultNamespace: kube-system
dependsOn:
  - name: lab-suse-fleet-kube-ovn

targetCustomizations:
  - name: demolab
    clusterSelector:
      matchLabels:
        management.cattle.io/cluster-display-name: demolab
    yaml:
      overlays:
        - demolab

overrideTargets:
  - clusterSelector:
      matchLabels:
        fleet-app-kube-ovn: "true"
