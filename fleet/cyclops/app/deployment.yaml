apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyclops
  labels:
    app: cyclops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cyclops
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cyclops
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: cyclops
          image: registry.lab.suse/library/cyclops:latest
          imagePullPolicy: IfNotPresent
          args:
            - -seed-admin
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          envFrom:
            - secretRef:
                name: cyclops-secrets
      restartPolicy: Always
